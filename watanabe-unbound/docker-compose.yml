services:
  web:
    container_name: watanabe-unbound_web_1
    # pinned by digest = immutable; matches klutchell/unbound:latest (unbound 1.24.x-era build)
    image: ghcr.io/klutchell/unbound@sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478
    restart: unless-stopped
    # image entrypoint is bare `unbound`; -d keeps it in the foreground
    # so the container does not daemonize-and-exit
    command: -d
    volumes:
      - "${UMBREL_ROOT}/unbound-dot.conf:/etc/unbound/unbound.conf:ro"
    ports:
      - "5335:5335/udp"
      - "5335:5335/tcp"
