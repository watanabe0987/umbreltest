version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: watanabe-reostream_web_1
      APP_PORT: '8562'
      PROXY_AUTH_ADD: 'false'
    container_name: watanabe-reostream_app_proxy_1
  web:
    restart: unless-stopped
    image: ghcr.io/volttech21/reostream:0.1.5
    container_name: watanabe-reostream_web_1
    ports:
      - '8560:8560'
      - '8561:8561'
      - '8562:8562'
    volumes:
      - data:/data

volumes:
  data:
