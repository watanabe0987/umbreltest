version: "3.7"

services:
  web:
    image: ghcr.io/roryeckel/wyoming_openai:0.8.0
    container_name: watanabe-venice-tts_web_1
    restart: unless-stopped
    ports:
      - "10300:10300"
    volumes:
      - ${APP_DATA_DIR}/tts.env:/data/tts.env:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /data/tts.env ]; then
          echo "=========================================================="
          echo "Venice TTS Bridge: /data/tts.env is missing or empty."
          echo "Create it on the umbrel host at:"
          echo "  /home/umbrel/umbrel/app-data/watanabe-venice-tts/tts.env"
          echo "with a single line (no quotes):"
          echo "  TTS_OPENAI_KEY=YOUR_VENICE_API_KEY"
          echo "Then restart this app."
          echo "=========================================================="
          exit 1
        fi
        KEY=$$(sed -n 's/^TTS_OPENAI_KEY=//p' /data/tts.env | head -1 | tr -d '"')
        if [ -z "$$KEY" ]; then
          echo "Venice TTS Bridge: tts.env exists but has no TTS_OPENAI_KEY= line."
          echo "The file must contain exactly one line:"
          echo "  TTS_OPENAI_KEY=YOUR_VENICE_API_KEY"
          exit 1
        fi
        export TTS_OPENAI_KEY="$$KEY"
        echo "Venice TTS Bridge: key loaded, starting wyoming_openai on port 10300"
        exec python -m wyoming_openai --uri tcp://0.0.0.0:10300 --log-level INFO
    environment:
      - TTS_OPENAI_URL=https://api.venice.ai/api/v1
      - TTS_MODELS=tts-xai-v1
      - TTS_VOICES=eve ara rex sal leo helios luna iris sirius
      - TTS_SPEED=1.0
    init: true
